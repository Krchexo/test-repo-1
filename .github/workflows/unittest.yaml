name: Synrax Unittest Runner

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  run-unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SYNRAX_API_BASE_URL: "https://daf4-207-98-72-219.ngrok-free.app"
      DEFAULT_HEALTH_URL: "http://127.0.0.1:5000/health"
      SYNRAX_OIDC_AUDIENCE: "synrax"

      DEFAULT_LISTENER_CMD: "python app.py"

    steps:
      - name: Checkout User Repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ./backend/requirements.txt
      - name: Build and Install Dependencies (Python)
        shell: bash
        run: |
          set -euo pipefail
          cd "./backend"

          # If you template .BuildCommand, it should usually be:
          # python -m pip install -r requirements.txt
          echo "Running build/install command: pip install -r requirements.txt"
          python -V
          python -m pip install --upgrade pip
          bash -lc 'pip install -r requirements.txt' > build.log 2>&1 || {
            echo "Build/install failed. Dumping build.log:"
            tail -n 200 build.log || true
            exit 1
          }

          # sanity check for your exact issue:
          python -c "import uvicorn; print('uvicorn:', uvicorn.__version__)" >> build.log 2>&1 || {
            echo "uvicorn is not importable after install. Dumping build.log:"
            tail -n 200 build.log || true
            exit 1
          }

      - name: Start API listener
        shell: bash
        run: |
          set -euo pipefail
          cd "./backend"

          : "${DEFAULT_LISTENER_CMD:?DEFAULT_LISTENER_CMD is required}"
          : "${DEFAULT_HEALTH_URL:?DEFAULT_HEALTH_URL is required}"

          echo "Starting listener using: $DEFAULT_LISTENER_CMD"
          rm -f listener.pid listener.log

          nohup bash -lc "$DEFAULT_LISTENER_CMD" > listener.log 2>&1 &
          echo $! > listener.pid
          echo "Listener PID: $(cat listener.pid)"

      - name: Check on Health Endpoints
        shell: bash
        run: |
          set -euo pipefail
          cd "./backend"

          URL="$DEFAULT_HEALTH_URL"
          PID="$(cat listener.pid)"

          echo "Waiting for health: $URL (pid=$PID)"

          for i in {1..60}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Listener process is not running (pid=$PID). Dumping listener.log:"
              tail -n 200 listener.log || true
              exit 1
            fi

            if curl -fsS "$URL" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi

            echo "Not ready yet... (${i}/60)"
            sleep 2
          done

          echo "Health check failed after timeout. Dumping listener.log:"
          tail -n 200 listener.log || true
          exit 1

      - name: Checkout Synrax unittest public repo
        uses: actions/checkout@v4
        with:
          repository: Synrax-App/unittest
          ref: main
          path: unittest

      - name: Setup Go (Synrax CLI)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Ensure jq exists
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOK=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SYNRAX_OIDC_AUDIENCE}" \
            | jq -r .value)

          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then
            echo "ERROR: failed to obtain OIDC token"
            exit 1
          fi

          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Run Synrax CLI
        shell: bash
        working-directory: unittest
        run: |
          set -euo pipefail
          go run . read '1136654203' 'docs.txt' '${{ steps.oidc.outputs.token }}'

          if [ ! -f report.json ]; then
            echo "ERROR: report.json was not created."
            exit 1
          fi

          echo "report.json produced successfully."

      - name: Commit report.json to repo
        shell: bash
        run: |
          set -euo pipefail

          cp unittest/report.json ./report.json

          git config user.name "synrax-bot"
          git config user.email "synrax-bot@users.noreply.github.com"

          git add report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Synrax unittest report"
            git push
          fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synrax-run-logs
          path: |
            ./backend/listener.log
            ./backend/build.log
            unittest/**/*.log